version: "3.8"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: timetrack
      POSTGRES_PASSWORD: timetrack
      POSTGRES_DB: timetrack
    ports:
      - "5432:5432"
    volumes:
      - timetrack_pgdata:/var/lib/postgresql/data

volumes:
  timetrack_pgdata:
