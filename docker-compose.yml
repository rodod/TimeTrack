version: "3.8"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: timetrack
      POSTGRES_PASSWORD: timetrack
      POSTGRES_DB: timetrack
    ports:
      - "5432:5432"
    volumes:
      - timetrack_pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://timetrack:timetrack@db:5432/timetrack
      - FLASK_ENV=development
    depends_on:
      - db

volumes:
  timetrack_pgdata:
